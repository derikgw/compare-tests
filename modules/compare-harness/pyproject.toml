[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compare-harness"
version = "0.1.0"
description = "Configurable ETL baseline/candidate comparison harness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sprig-config>=0.7.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
compare-harness = "compare_harness.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
